[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "odoo-miner"
version = "0.1.0"
description = "Turn Chrome DevTools Recorder sessions of Odoo workflows into structured click and backend-call data for analysis agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "rich>=13",
    "langchain==1.4.3",
    "langgraph==1.2.12",
    "langgraph-checkpoint-sqlite>=2.0",
    "deepagents==0.7.21",
    "langsmith==0.14.4",
    "langchain-anthropic==1.7.5",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
odoo-miner = "odoo_miner.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/odoo_miner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["evals"]

[dependency-groups]
dev = [
    "aiosmtpd>=1.4.6",
    "langgraph-cli[inmem]>=0.4.32",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["vendor", "out"]

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, bugbear, pyupgrade, simplify
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
ignore = [
    "E501",    # long lines are wrapped by hand where it helps; prompts and SQL-ish strings stay whole
    "SIM108",  # ternaries are not always clearer
]

[tool.ruff.lint.flake8-bugbear]
# Typer declares CLI parameters as call defaults; that is its API, not a bug.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
